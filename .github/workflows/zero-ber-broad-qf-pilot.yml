name: Zero-BER broad-QF real JPEG pilot
on:
  workflow_dispatch:
  push:
    branches:
      - research/pso-literature-objective-design-20261113
    paths:
      - '.github/workflows/zero-ber-broad-qf-pilot.yml'
      - 'experiments/adaptive_d1_zero_ber_pilot.py'
      - 'experiments/adaptive_d1_zero_ber_selection.py'
jobs:
  broad-qf:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned image dependencies
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 scipy==1.13.1 scikit-image==0.24.0 opencv-python-headless==4.10.0.84 PyWavelets==1.6.0 pytest==8.3.3
          python -m pip install --no-build-isolation 'git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
      - name: Validate zero-BER selection logic
        run: python -m pytest -q tests/test_adaptive_d1_zero_ber_selection.py
      - name: Generate public images
        run: python -m experiments.adaptive_d1_public_image_corpus --output-dir /tmp/zero-ber-images
      - name: Real JPEG zero-BER broad-QF experiment
        run: |
          mkdir -p /tmp/zero-ber-input
          cp /tmp/zero-ber-images/astronaut.png /tmp/zero-ber-input/
          cp /tmp/zero-ber-images/chelsea.png /tmp/zero-ber-input/
          cp /tmp/zero-ber-images/coffee.png /tmp/zero-ber-input/
          python -m experiments.adaptive_d1_zero_ber_pilot --input-dir /tmp/zero-ber-input --output-dir /tmp/zero-ber-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-ber-broad-qf-results
          path: /tmp/zero-ber-results
          if-no-files-found: warn
