name: Integer constrained BO d1 real JPEG pilot

on:
  pull_request:
    paths:
      - 'experiments/constrained_bo_d1.py'
      - 'experiments/constrained_bo_d1_pilot.py'
      - 'tests/test_constrained_bo_d1.py'
      - '.github/workflows/constrained-bo-d1-pilot.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.8.0 pytest==8.3.3
      - run: python -m pytest -q tests/test_constrained_bo_d1.py tests/test_auto_zero_ber.py tests/test_early_reject_policy.py

  paired-real-jpeg:
    needs: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        image: [astronaut, chelsea, coffee]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies matching V2 early-rejection experiment
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 scipy==1.13.1 scikit-learn==1.8.0 scikit-image==0.24.0 opencv-python-headless==4.10.0.84 PyWavelets==1.6.0 pytest==8.3.3
          python -m pip install --no-build-isolation 'git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
      - name: Generate same frozen public image corpus as V2
        run: python -m experiments.adaptive_d1_public_image_corpus --output-dir /tmp/bo-input
      - name: Run paired BO and V2 with actual JPEG QFs
        run: |
          mkdir -p /tmp/bo-single
          cp /tmp/bo-input/${{ matrix.image }}.png /tmp/bo-single/
          python -m experiments.constrained_bo_d1_pilot --input-dir /tmp/bo-single --output-dir /tmp/bo-paired --compare-v2
      - name: Archive real measurements and comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constrained-bo-${{ matrix.image }}
          path: /tmp/bo-paired
          if-no-files-found: warn
          retention-days: 90
