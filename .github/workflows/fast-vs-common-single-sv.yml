name: Fast mode vs common single-SV comparison
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install fixed upstream dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python==4.13.0.92 PyWavelets==1.10.0 setuptools==84.2.1
          python -m pip install --no-build-isolation 'blind_watermark @ git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
          python -m pip check
      - name: Four-arm controlled test
        run: |
          python -m experiments.fast_vs_common_single_sv --output-dir "$RUNNER_TEMP/fast-vs-common"
          cat "$RUNNER_TEMP/fast-vs-common/results.csv"
          cat "$RUNNER_TEMP/fast-vs-common/timing.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-vs-common-single-sv-results
          path: ${{ runner.temp }}/fast-vs-common/
          retention-days: 30
