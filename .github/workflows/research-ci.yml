name: Research CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  paper-low-qf:
    if: github.head_ref == 'codex/paper-qim-low-qf'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned watermark runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python==4.13.0.92 PyWavelets==1.10.0 setuptools==84.2.1
          python -m pip install --no-build-isolation 'blind_watermark @ git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
          python -m pip check
      - name: Test and reproduce all three finite candidates
        run: |
          python -m pytest -q
          python -m experiments.paper_low_qf --output-dir "$RUNNER_TEMP/paper-low-qf" --variants upstream g6 paper_centered90 paper_ratio_floor90 paper_nearest_zero90
          python - "$RUNNER_TEMP/paper-low-qf/results.csv" <<'PY'
          import csv, sys
          from pathlib import Path
          expected = {}
          for folder in ('paper-low-qf-initial', 'paper-low-qf-nearest'):
              for row in csv.DictReader((Path('outputs')/folder/'results.csv').open()):
                  expected[row['variant'],row['qf']] = row['extracted_bits']
          observed = {(r['variant'],r['qf']):r['extracted_bits'] for r in csv.DictReader(open(sys.argv[1]))}
          assert expected == observed, (expected, observed)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-low-qf-replay
          path: ${{ runner.temp }}/paper-low-qf
          if-no-files-found: warn
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install and record dependencies
        run: |
          python --version
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze
          python -m PIL
      - name: Verify research results
        shell: bash
        run: |
          if python -m pytest -v; then
            echo 'PASS — SVD、JPEG 與研究資料驗收' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'FAIL — 請查看 Verify research results 的 pytest 錯誤紀錄' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  original-image-qf-scan:
    # The paired PSNR PR is scoped to QF15; leave the historical scan intact elsewhere.
    if: github.head_ref != 'codex/g6-psnr-qf15' && github.head_ref != 'codex/paper-qim-low-qf'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned original algorithm
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python==4.13.0.92 PyWavelets==1.10.0 setuptools==84.2.1
          python -m pip install --no-build-isolation 'blind_watermark @ git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
          python -m pip check
      - name: Verify tie-breaking and relative reduction
        run: |
          python - <<'PY'
          from experiments.ori_qf_scan import choose_worst_quality, relative_reduction
          assert choose_worst_quality([{'qf': 10, 'error_count': 6}, {'qf': 5, 'error_count': 6}, {'qf': 15, 'error_count': 5}]) == 5
          assert relative_reduction(20, 19) == 5.0
          assert relative_reduction(20, 18) == 10.0
          assert relative_reduction(0, 0) is None
          print('QF selection and relative BER rules: PASS')
          PY
      - name: Run 19-quality original BER scan
        run: |
          python -m experiments.ori_qf_scan --output-dir "$RUNNER_TEMP/ori-qf-scan"
          cat "$RUNNER_TEMP/ori-qf-scan/results.csv"
          cat "$RUNNER_TEMP/ori-qf-scan/manifest.json"
      - name: Archive experimental outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ori-image-qf5-to-95
          path: ${{ runner.temp }}/ori-qf-scan
          if-no-files-found: warn
          retention-days: 30

  svd-qim-qf15-exploration:
    if: github.head_ref != 'codex/g6-psnr-qf15' && github.head_ref != 'codex/paper-qim-low-qf'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install fixed upstream SVD
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python==4.13.0.92 PyWavelets==1.10.0 setuptools==84.2.1
          python -m pip install --no-build-isolation 'blind_watermark @ git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
          python -m pip check
      - name: Pre-registered QF15 SVD-only trials and secondary QF checks
        run: |
          python -m experiments.svd_qim_sweep --output-dir "$RUNNER_TEMP/qim-exploration"
          cat "$RUNNER_TEMP/qim-exploration/results.csv"
          cat "$RUNNER_TEMP/qim-exploration/manifest.json"
      - name: Archive all candidates and attack images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qf15-svd-qim-all-candidates
          path: ${{ runner.temp }}/qim-exploration
          if-no-files-found: warn
          retention-days: 30

  svd-qim-selected-validation:
    if: github.head_ref != 'codex/g6-psnr-qf15' && github.head_ref != 'codex/paper-qim-low-qf'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install original version pinned at fixed commit
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python==4.13.0.92 PyWavelets==1.10.0 setuptools==84.2.1
          python -m pip install --no-build-isolation 'blind_watermark @ git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
          python -m pip check
      - name: Reproduce original and validate selected SVD quantizer
        run: |
          python -m experiments.svd_qim_validation --output-dir "$RUNNER_TEMP/svd90-validation"
          cat "$RUNNER_TEMP/svd90-validation/results.csv"
          cat "$RUNNER_TEMP/svd90-validation/manifest.json"
      - name: Archive selected SVD validation with all samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-svd-qim-validation-ori-image
          path: ${{ runner.temp }}/svd90-validation
          if-no-files-found: warn
          retention-days: 30

  g6-paired-psnr:
    if: github.head_ref == 'codex/g6-psnr-qf15'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned G6 runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python==4.13.0.92 PyWavelets==1.10.0 setuptools==84.2.1
          python -m pip install --no-build-isolation 'blind_watermark @ git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
          python -m pip check
      - name: Reproduce fixed QF15 PSNR and BER
        run: |
          python -m experiments.svd_qim_psnr --output-dir "$RUNNER_TEMP/g6-psnr"
          cat "$RUNNER_TEMP/g6-psnr/results.csv"
          cat "$RUNNER_TEMP/g6-psnr/manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-qf15-psnr
          path: |
            ${{ runner.temp }}/g6-psnr/results.csv
            ${{ runner.temp }}/g6-psnr/manifest.json
          if-no-files-found: warn
