name: Extreme d2=720 paired experiment
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  d2-720:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python==4.13.0.92 PyWavelets==1.10.0 setuptools==84.2.1
          python -m pip install --no-build-isolation 'blind_watermark @ git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
      - name: Run d1=36 d2=720 and original d2=20
        run: |
          python -m experiments.svd_qim_d2_720 --output-dir "$RUNNER_TEMP/d2-720"
          cat "$RUNNER_TEMP/d2-720/results.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-36-d2-720-results
          path: ${{ runner.temp }}/d2-720/
          retention-days: 30
