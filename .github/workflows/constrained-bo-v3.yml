name: Constrained BO V3 partial-QF real JPEG experiment

on:
  pull_request:
    paths:
      - 'experiments/constrained_bo_d1_v3.py'
      - 'experiments/constrained_bo_d1_pilot.py'
      - 'experiments/early_reject_d1_pilot.py'
      - 'tests/test_constrained_bo_d1_v3.py'
      - '.github/workflows/constrained-bo-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.8.0 pytest==8.3.3
      - name: Run V3 and upstream policy tests
        run: python -m pytest -q tests/test_constrained_bo_d1_v3.py tests/test_constrained_bo_d1_v2.py tests/test_constrained_bo_d1.py tests/test_early_reject_policy.py

  paired-real-jpeg:
    needs: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        image: [astronaut, coffee, rocket]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned watermark/JPEG dependencies
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 scipy==1.13.1 scikit-learn==1.8.0 scikit-image==0.24.0 opencv-python-headless==4.10.0.84 PyWavelets==1.6.0 pytest==8.3.3
          python -m pip install --no-build-isolation 'git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
      - name: Generate identical frozen public image corpus
        run: python -m experiments.adaptive_d1_public_image_corpus --output-dir /tmp/bo-v3-input
      - name: Compare V3 with unchanged legacy V2 using real JPEG
        run: |
          mkdir -p /tmp/bo-v3-single
          cp /tmp/bo-v3-input/${{ matrix.image }}.png /tmp/bo-v3-single/
          python -m experiments.constrained_bo_d1_pilot --input-dir /tmp/bo-v3-single --output-dir /tmp/bo-v3-paired --bo-version v3 --compare-v2
      - name: Archive exact measurements, all attempted QFs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbo-v3-${{ matrix.image }}
          path: /tmp/bo-v3-paired
          if-no-files-found: warn
          retention-days: 90
