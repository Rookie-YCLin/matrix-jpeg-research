name: SVD-QIM controlled ablation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python==4.13.0.92 PyWavelets==1.10.0 setuptools==84.2.1
          python -m pip install --no-build-isolation 'blind_watermark @ git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
          python -m pip check
      - name: Run controlled ablation
        run: |
          python -m experiments.svd_qim_ablation --output-dir "$RUNNER_TEMP/svd-ablation"
          cat "$RUNNER_TEMP/svd-ablation/results.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svd-qim-ablation-results
          path: ${{ runner.temp }}/svd-ablation/
          retention-days: 30
