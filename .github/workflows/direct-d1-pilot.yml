name: DIRECTGO-inspired d1 comparative JPEG pilot

on:
  pull_request:
    paths:
      - 'experiments/direct_d1.py'
      - 'experiments/direct_d1_pilot.py'
      - 'tests/test_direct_d1.py'
      - '.github/workflows/direct-d1-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.3
      - name: Test DIRECT policy without JPEG
        run: python -m pytest -q tests/test_direct_d1.py tests/test_auto_zero_ber.py

  real-jpeg:
    needs: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        image: [astronaut, chelsea, coffee]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install identical pinned runtime as previous V2 pilot
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 scipy==1.13.1 scikit-image==0.24.0 opencv-python-headless==4.10.0.84 PyWavelets==1.6.0 pytest==8.3.3
          python -m pip install --no-build-isolation 'git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
      - name: Generate fixed public images
        run: python -m experiments.adaptive_d1_public_image_corpus --output-dir /tmp/direct-images
      - name: Run DIRECT-inspired nine-QF JPEG search
        run: |
          mkdir -p /tmp/direct-input
          cp /tmp/direct-images/${{ matrix.image }}.png /tmp/direct-input/
          python -m experiments.direct_d1_pilot --input-dir /tmp/direct-input --output-dir /tmp/direct-results
      - name: Archive every measured d1 and each QF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-d1-${{ matrix.image }}
          path: /tmp/direct-results
          if-no-files-found: warn
          retention-days: 90
