name: V2 QF early-rejection held-out JPEG pilot

on:
  pull_request:
    paths:
      - '.github/workflows/early-reject-heldout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held-out-real-jpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        image: [camera, coins, moon, rocket]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install V2-matched pinned dependencies
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 scipy==1.13.1 scikit-image==0.24.0 opencv-python-headless==4.10.0.84 PyWavelets==1.6.0 pytest==8.3.3
          python -m pip install --no-build-isolation 'git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
      - name: Prepare existing held-out corpus
        run: python -m experiments.adaptive_d1_public_image_corpus --output-dir /tmp/qf-heldout-images
      - name: Evaluate V2 with safe early-stop QF checks
        run: |
          mkdir -p /tmp/qf-heldout-input
          cp /tmp/qf-heldout-images/${{ matrix.image }}.png /tmp/qf-heldout-input/
          python -m experiments.early_reject_d1_pilot --input-dir /tmp/qf-heldout-input --output-dir /tmp/qf-heldout-results
      - name: Archive full/partial checks and JPEG count
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-qf-heldout-${{ matrix.image }}
          path: /tmp/qf-heldout-results
          if-no-files-found: warn
          retention-days: 90
