name: Edge-case d1 d2 SVD-QIM comparison
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  edge-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python==4.13.0.92 PyWavelets==1.10.0 setuptools==84.2.1
          python -m pip install --no-build-isolation 'blind_watermark @ git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
      - name: Run edge-case comparisons
        run: |
          python -m experiments.svd_qim_edge_cases --output-dir "$RUNNER_TEMP/edge-cases"
          cat "$RUNNER_TEMP/edge-cases/results.csv"
          cat "$RUNNER_TEMP/edge-cases/manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svd-qim-edge-cases
          path: ${{ runner.temp }}/edge-cases/
          retention-days: 30
