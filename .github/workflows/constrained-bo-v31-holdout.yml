name: CBO V3.1 five-image held-out JPEG validation

on:
  pull_request:
    paths:
      - 'experiments/constrained_bo_d1_v3.py'
      - 'tests/test_constrained_bo_d1_v3.py'
      - 'experiments/constrained_bo_d1_pilot.py'
      - '.github/workflows/constrained-bo-v31-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned policy-test dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.8.0 pytest==8.3.3
      - name: Validate V3.1 plus older protocol invariants
        run: python -m pytest -q tests/test_constrained_bo_d1_v3.py tests/test_constrained_bo_d1_v2.py tests/test_constrained_bo_d1.py tests/test_early_reject_policy.py

  new-image-real-jpeg:
    needs: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        image: [clock, page, text, brick, grass]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact pinned watermark/JPEG dependencies
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 scipy==1.13.1 scikit-learn==1.8.0 scikit-image==0.24.0 opencv-python-headless==4.10.0.84 PyWavelets==1.6.0 pytest==8.3.3
          python -m pip install --no-build-isolation 'git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
      - name: Generate independent, unmodified scikit-image sample images
        run: python -m experiments.adaptive_d1_public_image_corpus --output-dir /tmp/cbo-v31-sources
      - name: Pair V3.1 and legacy V2 on unchanged real JPEG pipeline
        run: |
          mkdir -p /tmp/cbo-v31-single
          cp /tmp/cbo-v31-sources/${{ matrix.image }}.png /tmp/cbo-v31-single/
          python -m experiments.constrained_bo_d1_pilot --input-dir /tmp/cbo-v31-single --output-dir /tmp/cbo-v31-results --bo-version v3 --compare-v2
      - name: Archive all real JPEG observations and paired results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbo-v31-holdout-${{ matrix.image }}
          path: /tmp/cbo-v31-results
          if-no-files-found: warn
          retention-days: 90
