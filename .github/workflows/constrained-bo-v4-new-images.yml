name: CBO V4 warm-start four-image new JPEG validation

on:
  pull_request:
    paths:
      - 'experiments/constrained_bo_d1_v4.py'
      - 'experiments/constrained_bo_d1_v4_new_corpus.py'
      - 'experiments/constrained_bo_d1_pilot.py'
      - 'tests/test_constrained_bo_d1_v4.py'
      - '.github/workflows/constrained-bo-v4-new-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.8.0 pytest==8.3.3
      - name: Validate V4 and historical BO invariants
        run: python -m pytest -q tests/test_constrained_bo_d1_v4.py tests/test_constrained_bo_d1_v3.py tests/test_constrained_bo_d1_v2.py tests/test_constrained_bo_d1.py tests/test_early_reject_policy.py

  new-image-real-jpeg:
    needs: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        image: [colorwheel, hubble_deep_field, immunohistochemistry, human_mitosis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned real JPEG and watermark dependencies
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 scipy==1.13.1 scikit-learn==1.8.0 scikit-image==0.24.0 opencv-python-headless==4.10.0.84 PyWavelets==1.6.0 pytest==8.3.3
          python -m pip install --no-build-isolation 'git+https://github.com/guofei9987/blind_watermark.git@322c90dc02d45644692095b34d3a6b735b6edbd8'
      - name: Prepare frozen independent scikit-image inputs
        run: python -m experiments.constrained_bo_d1_v4_new_corpus --output-dir /tmp/cbo-v4-input
      - name: Run actual 36-evaluation V4 vs legacy V2 paired search
        run: |
          mkdir -p /tmp/cbo-v4-one
          cp /tmp/cbo-v4-input/${{ matrix.image }}.png /tmp/cbo-v4-one/
          python -m experiments.constrained_bo_d1_pilot --input-dir /tmp/cbo-v4-one --output-dir /tmp/cbo-v4-results --bo-version v4 --compare-v2
      - name: Archive measurements, every tested QF and paired metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbo-v4-${{ matrix.image }}
          path: /tmp/cbo-v4-results
          if-no-files-found: warn
          retention-days: 90
